<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo for My Dog</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>Todo for My Dog</h1>

      <form class="add-form" id="add-form">
        <label class="visually-hidden" for="new-task">New task</label>
        <input
          id="new-task"
          name="task"
          type="text"
          placeholder="Add a task for the dog…"
          autocomplete="off"
          maxlength="120"
        />
        <button type="submit">Add</button>
      </form>

      <div class="filters" role="group" aria-label="Show tasks">
        <button type="button" class="filter" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="filter" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" class="filter" data-filter="done" aria-pressed="false">Done</button>
      </div>

      <ul class="task-list" id="task-list"></ul>

      <p class="empty" id="empty-message" hidden>
        Nothing to do for the dog right now. Add the first task above.
      </p>

      <p class="counter" id="counter">0 items left</p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
